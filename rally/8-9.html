<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>🎥 웹챠 카멜레온 · 중계</title>
<link rel="icon" type="image/png" href="asset/logo.png?v=2">

<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' data: https://fonts.gstatic.com;
  img-src 'self' data: blob: https://www.gstatic.com;
  connect-src 'self' blob: https://*.firebaseio.com wss://*.firebaseio.com https://*.googleapis.com https://firebase.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://unpkg.com https://cdn.jsdelivr.net https://www.gstatic.com;
  frame-src 'none';
  worker-src 'self' blob:;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
  upgrade-insecure-requests;
">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/spectator.css">
</head>
<body>

<!-- 비밀번호 게이트 -->
<div id="gate" class="overlay-full">
  <div class="gate-box">
    <div class="gate-logo">🎥</div>
    <div class="gate-title">중계 시스템</div>
    <div class="gate-sub">웹챠 카멜레온 · 대회 관전자 뷰</div>
    <input id="gatePwd" type="password" placeholder="접속 코드" autocomplete="off" spellcheck="false">
    <button id="gateBtn">접속 →</button>
    <div id="gateErr" class="gate-err"></div>
  </div>
</div>

<!-- 방 선택 -->
<div id="roomPicker" class="overlay-full hidden">
  <div class="picker-box">
    <div class="picker-head">
      <div class="picker-title">📺 관전할 방 선택</div>
      <div class="picker-sub">플레이 중인 방만 표시</div>
    </div>
    <div id="roomList" class="room-grid"></div>
    <div class="picker-foot">
      <span class="dot-live"></span> 실시간 갱신
    </div>
  </div>
</div>

<!-- 로딩 -->
<div id="loading" class="overlay-full hidden">
  <div class="load-box">
    <div class="load-spin">🦎</div>
    <div class="load-text">맵 불러오는 중...</div>
    <div class="load-sub" id="loadMap"></div>
  </div>
</div>

<!-- 상단 좌: 현재 관전 대상 -->
<div id="hudTarget" class="hud hidden">
  <div class="hud-inner">
    <div class="hud-row">
      <span class="hud-icon">👤</span>
      <span id="tgtNick" class="hud-nick">-</span>
      <span id="tgtRole" class="hud-badge">-</span>
    </div>
    <div class="hud-row hud-stats">
      <span title="점수">💯 <b id="tgtScore">0</b></span>
      <span title="잡은 수">🔍 <b id="tgtCatch">0</b></span>
      <span title="따봉">👍 <b id="tgtLike">0</b></span>
      <span title="상태" id="tgtAlive">🟢 생존</span>
    </div>
  </div>
</div>

<!-- 상단 우: 방 정보 -->
<div id="hudRoom" class="hud hud-right hidden">
  <div class="hud-inner">
    <div class="hud-row">
      <span class="hud-icon">🏠</span>
      <span id="roomName" class="hud-nick">-</span>
    </div>
    <div class="hud-row hud-stats">
      <span id="roomMode">-</span>
      <span id="roomState">-</span>
      <span id="roomTimer">--:--</span>
    </div>
  </div>
</div>

<!-- 우상단 컨트롤 -->
<div id="ctrlBar" class="hidden">
  <button class="ctrl" id="btnPrev" title="이전 플레이어 (←)">◀</button>
  <button class="ctrl" id="btnNext" title="다음 플레이어 (→)">▶</button>
  <button class="ctrl toggle" id="btnAuto" title="자동 순환 (A)">🔄 <span id="autoLbl">OFF</span></button>
  <button class="ctrl toggle" id="btnFree" title="자유 카메라 (F)">🎥 자유</button>
  <button class="ctrl" id="btnRoom" title="다른 방 (R)">↩ 방</button>
</div>

<!-- 하단 플레이어 리스트 -->
<div id="playerBar" class="hidden">
  <div id="playerList"></div>
</div>

<!-- 미니맵 -->
<div id="minimap" class="hidden">
  <canvas id="minimapCanvas" width="180" height="180"></canvas>
  <div class="mm-label">MAP</div>
</div>

<!-- 브랜딩 -->
<div id="brand" class="hidden">
  🦎 WEBCHA CHAMELEON · LIVE
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="js/spectator.js"></script>
</body>
</html>
